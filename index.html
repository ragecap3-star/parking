<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 공유 주차장 관리</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f6f8; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .count { font-size: 32px; font-weight: bold; color: #2c3e50; }
        .btn { padding: 12px 24px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; margin: 5px; color: white; }
        .btn-in { background-color: #2ec4b6; }
        .btn-out { background-color: #e71d36; }
        .recommend { background-color: #eef2ff; border: 2px solid #6366f1; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: bold; color: #4338ca; }
    </style>
</head>
<body>

    <h2>🚗 실시간 공유 주차장 현황</h2>

    <div class="card">
        <div>현재 이동 안내 구역</div>
        <div id="recommendZone" class="recommend">데이터 불러오는 중...</div>
    </div>

    <!-- 1. 하이코 지상 주차장 -->
    <div class="card">
        <h3>하이코 지상 주차장 (최대 402대)</h3>
        <div class="count"><span id="ground_count">0</span> / 402</div>
        <button class="btn btn-in" onclick="changeCount('ground', 1)">입차 (+1)</button>
        <button class="btn btn-out" onclick="changeCount('ground', -1)">출차 (-1)</button>
    </div>

    <!-- 2. 하이코 지하 주차장 -->
    <div class="card">
        <h3>하이코 지하 주차장 (최대 118대)</h3>
        <div class="count"><span id="underground_count">0</span> / 118</div>
        <button class="btn btn-in" onclick="changeCount('underground', 1)">입차 (+1)</button>
        <button class="btn btn-out" onclick="changeCount('underground', -1)">출차 (-1)</button>
    </div>

    <!-- 3. 보문 단지 주차장 -->
    <div class="card">
        <h3>보문 단지 주차장 (최대 200대)</h3>
        <div class="count"><span id="bomun_count">0</span> / 200</div>
        <button class="btn btn-in" onclick="changeCount('bomun', 1)">입차 (+1)</button>
        <button class="btn btn-out" onclick="changeCount('bomun', -1)">출차 (-1)</button>
    </div>

    <script>
        // Firebase 설정 정보
        const firebaseConfig = {
          apiKey: "AIzaSyDXLRc2RKlumTBbMKYSrVpUossDBjFscCg",
          authDomain: "parking-info-7eb89.firebaseapp.com",
          databaseURL: "https://parking-info-7eb89-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "parking-info-7eb89",
          storageBucket: "parking-info-7eb89.firebasestorage.app",
          messagingSenderId: "446444341794",
          appId: "1:446444341794:web:1b2bed0e7b4a55aab0987b",
          measurementId: "G-66T1DDXPRF"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 3개 주차장 설정 (이름 및 최대 대수)
        const zones = {
            ground: { name: '하이코 지상', max: 402, current: 0 },
            underground: { name: '하이코 지하', max: 118, current: 0 },
            bomun: { name: '보문 단지', max: 200, current: 0 }
        };

        // UI 및 추천 구역 업데이트
        function updateUI() {
            document.getElementById('ground_count').innerText = zones.ground.current;
            document.getElementById('underground_count').innerText = zones.underground.current;
            document.getElementById('bomun_count').innerText = zones.bomun.current;

            // 잔여 주차 대수 계산
            let remGround = zones.ground.max - zones.ground.current;
            let remUnderground = zones.underground.max - zones.underground.current;
            let remBomun = zones.bomun.max - zones.bomun.current;

            let recommendText = "";

            if (remGround <= 0 && remUnderground <= 0 && remBomun <= 0) {
                recommendText = "⛔ 전체 주차장이 만차입니다";
            } else {
                // 가장 잔여 자리가 많은 곳을 추천
                let maxRem = Math.max(remGround, remUnderground, remBomun);
                if (maxRem === remGround) {
                    recommendText = `👉 하이코 지상 주차장으로 이동하세요 (여유: ${remGround}석)`;
                } else if (maxRem === remUnderground) {
                    recommendText = `👉 하이코 지하 주차장으로 이동하세요 (여유: ${remUnderground}석)`;
                } else {
                    recommendText = `👉 보문 단지 주차장으로 이동하세요 (여유: ${remBomun}석)`;
                }
            }

            document.getElementById('recommendZone').innerText = recommendText;
        }

        // 실시간 데이터 수신
        db.ref('zones').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.ground) zones.ground.current = data.ground.current;
                if (data.underground) zones.underground.current = data.underground.current;
                if (data.bomun) zones.bomun.current = data.bomun.current;
                updateUI();
            } else {
                // DB에 초기값이 없는 경우 세팅
                db.ref('zones').set({
                    ground: { current: 0, max: 402 },
                    underground: { current: 0, max: 118 },
                    bomun: { current: 0, max: 200 }
                });
            }
        });

        // 수량 변경 함수
        function changeCount(zone, val) {
            let target = zones[zone];
            let newCount = target.current + val;

            if (val > 0 && target.current >= target.max) {
                alert(`${target.name} 주차장은 이미 만차입니다!`);
                return;
            }
            if (newCount < 0) return;

            // 데이터베이스 업데이트
            db.ref('zones/' + zone).update({
                current: newCount,
                max: target.max
            });
        }
    </script>
</body>
</html>
