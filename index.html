<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 공유 주차장 관리</title>
    <!-- Firebase SDK (무료 실시간 DB 연동) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f6f8; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .count { font-size: 32px; font-weight: bold; color: #2c3e50; }
        .btn { padding: 12px 24px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; margin: 5px; color: white; }
        .btn-in { background-color: #2ec4b6; }
        .btn-out { background-color: #e71d36; }
        .recommend { background-color: #eef2ff; border: 2px solid #6366f1; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: bold; color: #4338ca; }
    </style>
</head>
<body>

    <h2>🚗 실시간 공유 주차장 현황</h2>

    <div class="card">
        <div>현재 이동 안내 구역</div>
        <div id="recommendZone" class="recommend">데이터 불러오는 중...</div>
    </div>

    <div class="card">
        <h3>A구역 (최대 10대)</h3>
        <div class="count"><span id="zoneA_count">0</span> / 10</div>
        <button class="btn btn-in" onclick="changeCount('A', 1)">입차 (+1)</button>
        <button class="btn btn-out" onclick="changeCount('A', -1)">출차 (-1)</button>
    </div>

    <div class="card">
        <h3>B구역 (최대 10대)</h3>
        <div class="count"><span id="zoneB_count">0</span> / 10</div>
        <button class="btn btn-in" onclick="changeCount('B', 1)">입차 (+1)</button>
        <button class="btn btn-out" onclick="changeCount('B', -1)">출차 (-1)</button>
    </div>

    <script>
        // 1. 본인의 Firebase 설정 정보로 교체하세요!
        const firebaseConfig = {
          apiKey: "AIzaSyDXLRc2RKlumTBbMKYSrVpUossDBjFscCg",
          authDomain: "parking-info-7eb89.firebaseapp.com",
          databaseURL: "https://parking-info-7eb89-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "parking-info-7eb89",
          storageBucket: "parking-info-7eb89.firebasestorage.app",
          messagingSenderId: "446444341794",
          appId: "1:446444341794:web:1b2bed0e7b4a55aab0987b",
          measurementId: "G-66T1DDXPRF"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 기본 구역 설정
        const zones = {
            A: { max: 10, current: 0 },
            B: { max: 10, current: 0 }
        };

        // 화면(UI) 업데이트
        function updateUI() {
            document.getElementById('zoneA_count').innerText = zones.A.current;
            document.getElementById('zoneB_count').innerText = zones.B.current;

            let remA = zones.A.max - zones.A.current;
            let remB = zones.B.max - zones.B.current;

            let recommendText = "";
            if (remA <= 0 && remB <= 0) {
                recommendText = "⛔ 전체 만차입니다";
            } else if (remA >= remB) {
                recommendText = `👉 A구역으로 이동하세요 (여유: ${remA}석)`;
            } else {
                recommendText = `👉 B구역으로 이동하세요 (여유: ${remB}석)`;
            }
            document.getElementById('recommendZone').innerText = recommendText;
        }

        // 2. 실시간 데이터 수신 (다른 사람이 변경하면 자동 실행됨)
        db.ref('zones').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.A) zones.A.current = data.A.current;
                if (data.B) zones.B.current = data.B.current;
                updateUI();
            } else {
                // 초기 데이터가 없는 경우 DB 생성
                db.ref('zones').set({
                    A: { current: 0, max: 10 },
                    B: { current: 0, max: 10 }
                });
            }
        });

        // 3. 수량 변경 시 DB에 전송 (모든 접속자에게 즉시 반영)
        function changeCount(zone, val) {
            let target = zones[zone];
            let newCount = target.current + val;

            if (val > 0 && target.current >= target.max) {
                alert(`${zone}구역은 이미 만차입니다!`);
                return;
            }
            if (newCount < 0) return;

            // 데이터베이스 업데이트
            db.ref('zones/' + zone).update({
                current: newCount,
                max: target.max
            });
        }
    </script>
</body>
</html>
</body>
</html>
